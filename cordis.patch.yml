# dsh-cua — 把 Computer Use 装进 DeepSeek Harness
#
# 只 insert dsh-cua 自身：它在插件树里可见、可配，承担启动时的 TCC 自检，
# 并自己 spawn bin/cua-mcp 把工具挂到 ctx.tools。
#
# 不再用 @deepseek-ai/dsh-mcp-client 挂 cua-mcp：那个客户端构造 tools/call 时
# 只发 name 和 arguments，不带会话上下文，导致 cua-mcp 无法把操作目标归属到会话，
# 实时预览只能在所有对话里共享。自己起客户端才能把 exec.agent.id 放进 params._meta。
#
# 二进制路径：插件以 file: 依赖装进 profile 的 node_modules/dsh-cua/，
# 因此相对 profile 根目录的路径是稳定的。`ctx.baseUrl` 是 profile 目录的
# file URL，用它拼出 node_modules 下的二进制绝对路径。
# 若你改动了安装位置，只需改这里的 relative 部分。

- insert:
    - id: cua
      name: dsh-cua
